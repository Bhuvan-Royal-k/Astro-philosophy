<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC283" />
      <stop offset="45%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8E7036" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C6A15B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 4)">
    <circle cx="36" cy="36" r="32" fill="url(#glow)" />
    <!-- Concentric Celestial Rings -->
    <circle cx="36" cy="36" r="30" stroke="url(#logoGold)" stroke-width="1.2" opacity="0.8" />
    <circle cx="36" cy="36" r="26" stroke="#C6A15B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
    <circle cx="36" cy="36" r="20" stroke="#DFC283" stroke-width="0.6" opacity="0.6" />
    
    <!-- 8-Pointed Celestial Star Rays -->
    <path d="M 36 10 L 38.5 25 L 52 23 L 41 33 L 49 46 L 36 39 L 23 46 L 31 33 L 20 23 L 33.5 25 Z" 
          fill="url(#logoGold)" fill-opacity="0.18" stroke="url(#logoGold)" stroke-width="1" stroke-linejoin="round" />
    
    <!-- Gopuram Spire (Kalasam) Silhouette -->
    <path d="M 36 18 L 38.5 25 L 41 27 L 39.5 33 L 42 35 L 40 45 L 32 45 L 30 35 L 32.5 33 L 31 27 L 33.5 25 Z" 
          fill="none" stroke="#F4EFE4" stroke-width="1.3" stroke-linejoin="round" />
    <!-- Kalasam top jewel -->
    <circle cx="36" cy="16.5" r="2" fill="#DFC283" />
    <circle cx="36" cy="36" r="2.5" fill="#F4EFE4" />
  </g>

  <!-- Brand Typography -->
  <text x="88" y="38" font-family="'Cinzel', Georgia, serif" font-size="21" font-weight="600" letter-spacing="0.18em" fill="#F4EFE4">
    ASTRO PHILOSOPHY
  </text>
  <text x="89" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="500" letter-spacing="0.32em" fill="#C6A15B">
    SOUTH INDIAN VEDIC WISDOM
  </text>
  
  <!-- Subtle decorative line -->
  <line x1="88" y1="44" x2="330" y2="44" stroke="url(#logoGold)" stroke-width="0.6" opacity="0.4" />
</svg>
